<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Scooter Parts</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{margin:0;font-family:Inter,Arial;background:#0e0e0e;color:#fff}
header{padding:16px;text-align:center;font-size:20px;font-weight:600}
#search{width:90%;margin:10px auto;display:block;padding:10px;border-radius:10px;border:none;background:#1c1c1c;color:#fff}
.product{background:#161616;margin:12px;padding:12px;border-radius:16px}
.product img{width:100%;border-radius:12px}
.product h3{margin:8px 0 4px}
.product p{font-size:14px;opacity:.8}
.price{font-size:18px;margin:6px 0}
button{width:100%;padding:12px;border:none;border-radius:12px;background:#3b82f6;color:#fff;font-size:16px}
#cartBtn{position:fixed;bottom:16px;left:16px;right:16px}
</style>
</head>
<body>

<header>🛵 Запчасти на скутер</header>
<input id="search" placeholder="Поиск по названию или модели">
<div id="products"></div>
<div id="cartBtn"><button onclick="checkout()">Оформить заказ</button></div>

<script>
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSrsiJvEfGUju4klnul_Wp6btrSe_7d128hYw_o6x03P3CELk7Io2XnEYIWTFNfsF30dHTFu_tmXrvO/pubhtml';
const TG = Telegram.WebApp;
let cart = JSON.parse(localStorage.getItem('cart')||'[]');
let products = [];

fetch(SHEET_URL)
.then(r=>r.text())
.then(t=>{
const rows=t.split('\n').slice(1);
rows.forEach(r=>{
const [id,cat,name,model,price,img,desc,active]=r.split(',');
if(active?.trim()!=='yes')return;
products.push({name,model,price,img,desc});
});
render(products);
});

function render(list){
const wrap=document.getElementById('products');
wrap.innerHTML='';
list.forEach(p=>{
const d=document.createElement('div');
d.className='product';
d.innerHTML=`
<img src="${p.img}">
<h3>${p.name}</h3>
<p>${p.desc}</p>
<p><b>${p.model}</b></p>
<div class="price">${p.price} ₽</div>
<button onclick="add('${p.name}',${p.price})">В корзину</button>`;
wrap.appendChild(d);
});}

function add(name,price){
cart.push({name,price});
localStorage.setItem('cart',JSON.stringify(cart));
TG.showAlert('Добавлено в корзину');
}

document.getElementById('search').oninput=e=>{
const q=e.target.value.toLowerCase();
render(products.filter(p=>p.name.toLowerCase().includes(q)||p.model.toLowerCase().includes(q)));
}

function checkout(){
let t='🛒 Заказ:%0A',sum=0;
cart.forEach(i=>{t+=`- ${i.name} — ${i.price} ₽%0A`;sum+=i.price});
t+=`%0AИтого: ${sum} ₽`;
window.location.href=`https://t.me/andrew_malov?text=${t}`;
cart=[];localStorage.removeItem('cart');
}
</script>
</body>
</html>
