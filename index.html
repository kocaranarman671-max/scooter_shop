<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scooter Parts Shop</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0e0e0e;color:#fff}
    header{padding:16px;text-align:center;font-size:22px;font-weight:600;background:#151515;border-bottom:1px solid #222}
    .search{padding:12px 16px}
    .search input{width:100%;padding:12px;border-radius:14px;border:none;background:#1b1b1b;color:#fff}
    .products{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;padding:16px}
    .card{background:#181818;border-radius:18px;overflow:hidden;box-shadow:0 10px 25px rgba(0,0,0,.45);display:flex;flex-direction:column}
    .card img{width:100%;height:140px;object-fit:cover}
    .card-content{padding:12px;flex:1}
    .desc{font-size:13px;opacity:.7;margin-bottom:8px}
    .price{font-weight:600;margin-bottom:10px}
    .qty{display:flex;gap:8px;align-items:center;margin-bottom:10px}
    .qty button{width:32px;height:32px;border-radius:50%;border:none;background:#2f80ff;color:#fff;font-size:18px}
    .add{width:100%;border:none;border-radius:14px;padding:10px;background:linear-gradient(135deg,#2f80ff,#6aa8ff);color:#fff}
    .cart-btn{position:fixed;bottom:16px;left:16px;right:16px;background:#25d366;font-size:16px;padding:14px;border-radius:18px}
    .cart{position:fixed;inset:0;background:#0e0e0e;display:none;flex-direction:column}
    .cart-header{padding:16px;font-size:18px;font-weight:600;border-bottom:1px solid #222}
    .cart-items{flex:1;overflow:auto;padding:16px}
    .cart-item{display:flex;justify-content:space-between;margin-bottom:10px}
    .remove{color:#ff4d4d;cursor:pointer}
    .cart-footer{padding:16px;border-top:1px solid #222}
  </style>
</head>
<body>
<header>🛵 Магазин запчастей</header>
<div class="search"><input placeholder="Поиск..." oninput="search(this.value)"></div>
<div class="products" id="products"></div>
<button class="cart-btn" onclick="openCart()">🛒 Корзина</button>

<div class="cart" id="cart">
  <div class="cart-header">Корзина</div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-footer">
    <button class="add" onclick="checkout()">Оформить заказ</button>
    <button class="add" style="margin-top:10px;background:#444" onclick="closeCart()">Закрыть</button>
  </div>
</div>

<script>
const tg = window.Telegram.WebApp; tg.expand();
const GOOGLE_SHEET_URL='ВСТАВЬ_JSON';
const ADMIN_USERNAME='ТВОЙ_НИК';
let allProducts=[];
let cart=JSON.parse(localStorage.getItem('cart')||'[]');

async function loadProducts(){const r=await fetch(GOOGLE_SHEET_URL);allProducts=await r.json();render(allProducts)}
function render(arr){const c=document.getElementById('products');c.innerHTML='';arr.forEach((p,i)=>{p.qty=p.qty||1;const d=document.createElement('div');d.className='card';d.innerHTML=`<img src="${p.image}"><div class=card-content><h3>${p.name}</h3><div class=desc>${p.description}</div><div class=price>${p.price} ₽</div><div class=qty><button onclick="chg(${i},-1)">−</button><span id=q${i}>${p.qty}</span><button onclick="chg(${i},1)">+</button></div><button class=add onclick="add(${i})">В корзину</button></div>`;c.appendChild(d)})}
function chg(i,d){allProducts[i].qty=Math.max(1,allProducts[i].qty+d);document.getElementById('q'+i).innerText=allProducts[i].qty}
function add(i){const p=allProducts[i];const f=cart.find(x=>x.name===p.name);if(f)f.qty+=p.qty;else cart.push({...p});save()}
function save(){localStorage.setItem('cart',JSON.stringify(cart));tg.HapticFeedback.impactOccurred('light')}
function search(q){q=q.toLowerCase();render(allProducts.filter(p=>p.name.toLowerCase().includes(q)))}
function openCart(){document.getElementById('cart').style.display='flex';drawCart()}
function closeCart(){document.getElementById('cart').style.display='none'}
function drawCart(){const c=document.getElementById('cartItems');c.innerHTML='';cart.forEach((p,i)=>{const d=document.createElement('div');d.className='cart-item';d.innerHTML=`<div>${p.name} x${p.qty}</div><div><span>${p.price*p.qty} ₽</span> <span class=remove onclick="del(${i})">✕</span></div>`;c.appendChild(d)})}
function del(i){cart.splice(i,1);save();drawCart()}
function checkout(){if(!cart.length)return;let t='🛒 Заказ:%0A%0A',sum=0;cart.forEach((p,i)=>{t+=`${i+1}. ${p.name} x${p.qty} — ${p.price*p.qty} ₽%0A`;sum+=p.price*p.qty});t+=`%0AИтого: ${sum} ₽`;tg.openTelegramLink(`https://t.me/${ADMIN_USERNAME}?text=${t}`)}
loadProducts();
</script>
</body>
</html>
